<!DOCTYPE html>

            </div>
            <div class="form-group">
                <label for="q10">Do u have a strong bond with your partner?</label>
                <textarea id="q10" name="q10" required></textarea>
            </div>
            <div class="form-group">

            <div class="form-group">
